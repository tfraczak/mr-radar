# Verify pipeline: typecheck + lint + test + build, mirroring `yarn verify`
# locally. Runs on Linux (fast signal) and macOS (the actual target platform).
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # Nothing in CI launches Electron; skip the ~100MB binary download.
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --immutable
      - run: yarn typecheck
      - run: yarn lint
      - run: yarn test
      - run: yarn build
